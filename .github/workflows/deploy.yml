# KMD CI/CD Pipeline – Build, Test, and Deploy to Azure App Service
name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/Kmd.Web/Kmd.Web.csproj'
  PUBLISH_PATH: './publish'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # 4. Build the project
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # 5. Run tests (if any test projects exist)
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal || true

      # 6. Publish the application for deployment
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_PATH }}

      # 7. Upload artifact for the deploy job
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kmd-web
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      # 1. Download the published artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kmd-web
          path: ${{ env.PUBLISH_PATH }}

      # 2. Deploy to Azure App Service using publish profile
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
